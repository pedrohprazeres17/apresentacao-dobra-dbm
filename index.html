<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1736">
  <title>DOBRA — apresentação animada</title>
  <style>
    :root{--navy:#0b1736;--paper:#f5f0e6;--sky:#8ed8f8;--orange:#ff5a36;--ease:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#070e22;font-family:Arial,sans-serif}button{font:inherit}
    .stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center;background:var(--navy);box-shadow:0 40px 100px #0008;overflow:hidden}
    #frame{position:absolute;inset:0;width:1600px;height:900px;border:0;background:var(--navy);transform-origin:center;opacity:0}
    #frame.ready{opacity:1}.stage.enter #frame{animation:frameIn .9s var(--ease) both}.stage.exit #frame{animation:frameOut .42s cubic-bezier(.7,0,.84,0) both}
    @keyframes frameIn{from{opacity:0;transform:scale(1.045) translateX(22px)}to{opacity:1;transform:none}}
    @keyframes frameOut{to{opacity:0;transform:scale(.98) translateX(-24px)}}
    .fold{position:absolute;z-index:20;inset:0;pointer-events:none;visibility:hidden}.fold.run{visibility:visible}
    .fold i{position:absolute;inset:-2px;background:var(--orange);transform:scaleX(0)}
    .fold i:first-child{clip-path:polygon(0 0,52% 0,44% 100%,0 100%);transform-origin:left}.fold i:last-child{background:var(--sky);clip-path:polygon(52% 0,100% 0,100% 100%,44% 100%);transform-origin:right}
    .fold.cover i{animation:foldCover .5s cubic-bezier(.76,0,.24,1) both}.fold.cover i:last-child{animation-delay:.07s}.fold.reveal i{animation:foldReveal .65s var(--ease) both}.fold.reveal i:last-child{animation-delay:.05s}
    @keyframes foldCover{to{transform:scaleX(1)}}@keyframes foldReveal{from{transform:scaleX(1)}to{transform:scaleX(0)}}
    .tiles{position:absolute;z-index:21;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(5,1fr);pointer-events:none;visibility:hidden}.tiles.run{visibility:visible}.tiles b{background:var(--navy);transform:scale(.02);opacity:0}.tiles.cover b{animation:tileIn .36s var(--ease) both;animation-delay:calc(var(--i)*16ms)}.tiles.reveal b{animation:tileOut .5s var(--ease) both;animation-delay:calc(var(--i)*11ms)}
    @keyframes tileIn{to{opacity:1;transform:scale(1.04)}}@keyframes tileOut{from{opacity:1;transform:scale(1.04)}to{opacity:0;transform:scale(.02) rotate(9deg)}}
    .iris{position:absolute;z-index:22;left:50%;top:50%;width:160px;height:160px;border-radius:50%;background:var(--orange);transform:translate(-50%,-50%) scale(0);pointer-events:none;visibility:hidden}.iris.run{visibility:visible}.iris.cover{animation:irisIn .62s cubic-bezier(.76,0,.24,1) both}.iris.reveal{animation:irisOut .7s var(--ease) both}
    @keyframes irisIn{to{transform:translate(-50%,-50%) scale(14)}}@keyframes irisOut{from{transform:translate(-50%,-50%) scale(14)}to{transform:translate(-50%,-50%) scale(0)}}
    .dive{position:absolute;z-index:23;inset:-20%;background:repeating-linear-gradient(180deg,var(--sky) 0 70px,var(--navy) 70px 140px);transform:translateY(-110%);pointer-events:none;visibility:hidden}.dive.run{visibility:visible}.dive.cover{animation:diveIn .52s cubic-bezier(.76,0,.24,1) both}.dive.reveal{animation:diveOut .68s var(--ease) both}@keyframes diveIn{to{transform:translateY(0)}}@keyframes diveOut{from{transform:translateY(0)}to{transform:translateY(110%)}}
    .chrome{position:fixed;z-index:40;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid #ffffff20;border-radius:999px;background:#071029d9;box-shadow:0 12px 36px #0007;backdrop-filter:blur(16px);opacity:.28;transition:.25s}.chrome:hover,.chrome:focus-within{opacity:1}.chrome button{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:var(--paper);cursor:pointer}.chrome button:hover{background:var(--orange);color:var(--navy)}.count{min-width:82px;color:var(--paper);font:700 11px monospace;letter-spacing:.12em;text-align:center}.track{width:min(32vw,420px);height:3px;background:#ffffff25;overflow:hidden}.track i{display:block;width:100%;height:100%;background:var(--sky);transform:scaleX(0);transform-origin:left;transition:transform .55s var(--ease)}
    .hint{position:fixed;z-index:39;right:18px;top:18px;padding:8px 11px;border:1px solid #ffffff18;color:#f5f0e688;background:#071029aa;font:700 9px monospace;letter-spacing:.08em;text-transform:uppercase;transition:.3s}.hint.hide{opacity:0}.overview{position:fixed;z-index:50;inset:0;padding:7vh 5vw;background:#071029f5;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;overflow:auto}.overview[hidden]{display:none}.overview button{min-height:120px;padding:18px;border:1px solid #ffffff1d;background:#0b1736;color:var(--paper);text-align:left;cursor:pointer;transition:.25s}.overview button:hover{border-color:var(--sky);transform:translateY(-4px)}.overview small{display:block;color:var(--orange);font:700 10px monospace}.overview b{display:block;margin-top:28px;font-size:18px}.overview .close{position:fixed;right:24px;top:20px;width:42px;min-height:42px;padding:0;border-radius:50%;text-align:center;font-size:22px}
    @media(max-width:800px){.track{width:26vw}.overview{grid-template-columns:1fr 1fr}.hint{display:none}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="stage" id="stage"><iframe id="frame" title="Slide atual" src="dobra-pdf.html?slide=1"></iframe><div class="fold" id="fold"><i></i><i></i></div><div class="tiles" id="tiles"></div><div class="iris" id="iris"></div><div class="dive" id="dive"></div></main>
  <div class="hint" id="hint">clique, espaço ou → para avançar</div>
  <nav class="chrome" aria-label="Controles"><button id="prev" aria-label="Anterior">←</button><span class="count"><b id="current">01</b> / 13</span><div class="track"><i id="progress"></i></div><button id="overviewButton" aria-label="Visão geral">⌘</button><button id="fullscreen" aria-label="Tela cheia">⛶</button><button id="next" aria-label="Próximo">→</button></nav>
  <div class="overview" id="overview" hidden></div>
  <script>
    const titles=['DOBRA','O que é Wordle?','A tração do Wordle','Termo: mais rápido e com menos risco','A oportunidade','A solução DOBRA','A máquina em cinco etapas','O que é Krillion?','Krillion: usuários e receita','O primeiro protótipo','Aquisição e receita','Fatos e hipóteses','A tese'];
    const transitions=['fold','tiles','fold','iris','fold','tiles','fold','dive','dive','iris','tiles','fold','iris'];
    const stage=document.querySelector('#stage'),frame=document.querySelector('#frame'),progress=document.querySelector('#progress'),current=document.querySelector('#current'),overview=document.querySelector('#overview'),hint=document.querySelector('#hint');
    let index=Math.max(0,Math.min(12,(+location.hash.slice(1)||1)-1)),busy=false;
    const tiles=document.querySelector('#tiles');tiles.innerHTML=Array.from({length:40},(_,i)=>`<b style="--i:${Math.abs((i%8)-3.5)+Math.floor(i/8)}"></b>`).join('');
    function scale(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1600,innerHeight/900))}addEventListener('resize',scale);scale();
    function update(){current.textContent=String(index+1).padStart(2,'0');progress.style.transform=`scaleX(${(index+1)/13})`;history.replaceState(null,'',`#${index+1}`)}
    function animateInside(){try{const d=frame.contentDocument,s=d.querySelectorAll('.slide')[index];if(!s)return;d.body.style.overflow='hidden';const selectors=['.kicker','h1','h2','.wordle-intro-copy>p','.wordle-rules>*','.wordle-shot','.traction','.elapsed','.wordle-note','.case-note','.termo-stat','.risk-strip','.opportunity-note','.market-side','.fold-bridge','.fold-mark','.brand-word','.brand-tag','.brand-copy>p','.step','.process-note','.krillion-intro-copy>p','.krillion-rules>*','.krillion-shot','.krillion-copy>p','.krillion-word','.krillion-business-card','.krillion-caveat','.screen','.demo-copy .formula>*','.loop>*','.money','.known li','.unknown li','.honest','.closing-line'];let nodes=[...s.querySelectorAll(selectors.join(','))];nodes.forEach((el,i)=>{el.style.opacity='0';el.style.transform=index===7||index===8?`translateY(${Math.min(80,24+i*3)}px)`:`translateY(30px)`;el.style.transition=`opacity .7s ${100+i*55}ms cubic-bezier(.16,1,.3,1), transform .85s ${100+i*55}ms cubic-bezier(.16,1,.3,1)`});requestAnimationFrame(()=>requestAnimationFrame(()=>nodes.forEach(el=>{el.style.opacity='1';el.style.transform='none'})));if(index===6)s.querySelectorAll('.step').forEach((el,i)=>el.style.transitionDelay=`${170+i*120}ms`);if(index===10)s.querySelectorAll('.loop>div').forEach((el,i)=>el.style.transitionDelay=`${180+i*130}ms`)}catch(e){}}
    frame.addEventListener('load',()=>{frame.classList.add('ready');stage.classList.remove('exit');stage.classList.add('enter');animateInside();setTimeout(()=>stage.classList.remove('enter'),950)});
    async function show(next){if(busy)return;next=(next+13)%13;if(next===index)return;busy=true;hint.classList.add('hide');const fx=document.querySelector('#'+transitions[next]);fx.className=transitions[next]+' run cover';stage.classList.add('exit');await new Promise(r=>setTimeout(r,600));index=next;update();frame.classList.remove('ready');frame.src=`dobra-pdf.html?slide=${index+1}&present=1`;fx.className=transitions[next]+' run reveal';await new Promise(r=>setTimeout(r,760));fx.className=transitions[next];busy=false}
    document.querySelector('#prev').onclick=e=>{e.stopPropagation();show(index-1)};document.querySelector('#next').onclick=e=>{e.stopPropagation();show(index+1)};
    document.querySelector('#fullscreen').onclick=e=>{e.stopPropagation();document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
    function toggleOverview(){if(!overview.hidden){overview.hidden=true;return}overview.innerHTML='<button class="close" aria-label="Fechar">×</button>'+titles.map((t,i)=>`<button data-i="${i}"><small>${String(i+1).padStart(2,'0')}</small><b>${t}</b></button>`).join('');overview.hidden=false}
    document.querySelector('#overviewButton').onclick=e=>{e.stopPropagation();toggleOverview()};overview.onclick=e=>{e.stopPropagation();const b=e.target.closest('button');if(!b)return;if(b.classList.contains('close'))toggleOverview();else{overview.hidden=true;show(+b.dataset.i)}};
    addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(index+1)}if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(index-1)}if(e.key==='Home')show(0);if(e.key==='End')show(12);if(e.key.toLowerCase()==='o')toggleOverview();if(e.key.toLowerCase()==='f')document.querySelector('#fullscreen').click();if(e.key==='Escape')overview.hidden=true});
    stage.addEventListener('click',()=>show(index+1));let startX=null;addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{if(startX===null)return;const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>60)show(index+(dx<0?1:-1));startX=null},{passive:true});
    index=0;update();frame.src='dobra-pdf.html?slide=1&present=1';setTimeout(()=>hint.classList.add('hide'),5000);
  </script>
</body>
</html>
