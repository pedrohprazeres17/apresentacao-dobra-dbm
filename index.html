<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1736">
  <title>DOBRA — apresentação animada</title>
  <style>
    :root{--navy:#0b1736;--paper:#f5f0e6;--sky:#8ed8f8;--orange:#ff5a36;--ease:cubic-bezier(.16,1,.3,1)}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#070e22;font-family:Arial,sans-serif}button{font:inherit}
    .stage{position:absolute;left:50%;top:50%;width:1600px;height:900px;transform:translate(-50%,-50%) scale(var(--scale,1));transform-origin:center;background:var(--navy);box-shadow:0 40px 100px #0008;overflow:hidden}
    #frame{position:absolute;inset:0;width:1600px;height:900px;border:0;background:var(--navy);transform-origin:center;opacity:0}
    #frame.ready{opacity:1}.stage.enter #frame{animation:frameIn .82s var(--ease) both}.stage.exit #frame{animation:frameOut .5s ease both}
    @keyframes frameIn{from{opacity:0;transform:scale(1.018)}to{opacity:1;transform:none}}
    @keyframes frameOut{to{opacity:0;transform:scale(.992)}}
    .fold{position:absolute;z-index:20;inset:0;pointer-events:none;visibility:hidden}.fold.run{visibility:visible}
    .fold i{position:absolute;inset:-2px;background:var(--orange);transform:scaleX(0)}
    .fold i:first-child{clip-path:polygon(0 0,52% 0,44% 100%,0 100%);transform-origin:left}.fold i:last-child{background:var(--sky);clip-path:polygon(52% 0,100% 0,100% 100%,44% 100%);transform-origin:right}
    .fold.cover i{animation:foldCover .5s cubic-bezier(.76,0,.24,1) both}.fold.cover i:last-child{animation-delay:.07s}.fold.reveal i{animation:foldReveal .65s var(--ease) both}.fold.reveal i:last-child{animation-delay:.05s}
    @keyframes foldCover{to{transform:scaleX(1)}}@keyframes foldReveal{from{transform:scaleX(1)}to{transform:scaleX(0)}}
    .tiles{position:absolute;z-index:21;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(5,1fr);pointer-events:none;visibility:hidden}.tiles.run{visibility:visible}.tiles b{background:var(--navy);transform:scale(.02);opacity:0}.tiles.cover b{animation:tileIn .36s var(--ease) both;animation-delay:calc(var(--i)*16ms)}.tiles.reveal b{animation:tileOut .5s var(--ease) both;animation-delay:calc(var(--i)*11ms)}
    @keyframes tileIn{to{opacity:1;transform:scale(1.04)}}@keyframes tileOut{from{opacity:1;transform:scale(1.04)}to{opacity:0;transform:scale(.02) rotate(9deg)}}
    .iris{position:absolute;z-index:22;left:50%;top:50%;width:160px;height:160px;border-radius:50%;background:var(--orange);transform:translate(-50%,-50%) scale(0);pointer-events:none;visibility:hidden}.iris.run{visibility:visible}.iris.cover{animation:irisIn .62s cubic-bezier(.76,0,.24,1) both}.iris.reveal{animation:irisOut .7s var(--ease) both}
    @keyframes irisIn{to{transform:translate(-50%,-50%) scale(14)}}@keyframes irisOut{from{transform:translate(-50%,-50%) scale(14)}to{transform:translate(-50%,-50%) scale(0)}}
    .dive{position:absolute;z-index:23;inset:-20%;background:repeating-linear-gradient(180deg,var(--sky) 0 70px,var(--navy) 70px 140px);transform:translateY(-110%);pointer-events:none;visibility:hidden}.dive.run{visibility:visible}.dive.cover{animation:diveIn .52s cubic-bezier(.76,0,.24,1) both}.dive.reveal{animation:diveOut .68s var(--ease) both}@keyframes diveIn{to{transform:translateY(0)}}@keyframes diveOut{from{transform:translateY(0)}to{transform:translateY(110%)}}
    .story{position:absolute;z-index:30;inset:0;pointer-events:none;visibility:hidden;overflow:hidden;background:var(--navy)}.story.run{visibility:visible}.story .piece{position:absolute}.story.cover{animation:storyBgIn .34s ease-out both}.story.reveal{animation:storyBgOut .54s var(--ease) both}@keyframes storyBgIn{from{opacity:0}to{opacity:1}}@keyframes storyBgOut{from{opacity:1}to{opacity:0}}
    .story .label{left:70px;bottom:55px;color:var(--paper);font:700 15px monospace;letter-spacing:.14em;text-transform:uppercase;opacity:.55}.story.cover .label{animation:labelIn .45s var(--ease) .18s both}.story.reveal .label{animation:labelOut .25s ease both}@keyframes labelIn{from{opacity:0;transform:translateY(18px)}to{opacity:.55;transform:none}}@keyframes labelOut{to{opacity:0;transform:translateY(-12px)}}
    .story.wordle{display:grid;place-items:center;background:var(--paper)}.story.wordle .letters{position:relative;display:flex;gap:18px}.story.wordle .letters i{display:grid;place-items:center;width:150px;height:150px;background:var(--navy);color:var(--paper);font:900 74px Arial,sans-serif;font-style:normal;transform:rotateY(90deg)}.story.wordle.cover .letters i{animation:letterFlip .44s var(--ease) both;animation-delay:calc(var(--n)*65ms)}.story.wordle.reveal .letters i{animation:letterScatter .42s ease-in both;animation-delay:calc(var(--n)*28ms)}@keyframes letterFlip{to{transform:rotateY(0)}}@keyframes letterScatter{to{opacity:0;transform:translateY(calc((var(--n) - 2)*38px)) rotate(calc((var(--n) - 2)*7deg)) scale(.6)}}
    .story.timeline .rail{left:8%;right:8%;top:50%;height:5px;background:var(--sky);transform:scaleX(0);transform-origin:left}.story.timeline .dot{top:calc(50% - 22px);width:48px;height:48px;border-radius:50%;background:var(--orange);transform:scale(0)}.story.timeline .dot.a{left:10%}.story.timeline .dot.b{right:10%;background:var(--sky)}.story.timeline .number{top:35%;color:var(--paper);font:900 90px Arial,sans-serif;opacity:0}.story.timeline .number.a{left:10%}.story.timeline .number.b{right:10%;color:var(--sky)}.story.timeline.cover .rail{animation:railGrow .55s var(--ease) both}.story.timeline.cover .dot{animation:pop .36s var(--ease) .32s both}.story.timeline.cover .number{animation:numberIn .42s var(--ease) .36s both}.story.timeline.reveal .rail,.story.timeline.reveal .dot,.story.timeline.reveal .number{animation:timelineOut .34s ease-in both}@keyframes railGrow{to{transform:scaleX(1)}}@keyframes pop{to{transform:scale(1)}}@keyframes numberIn{to{opacity:1;transform:translateY(-30px)}}@keyframes timelineOut{to{opacity:0;transform:translateX(80px)}}
    .story.termo{background:var(--paper)}.story.termo .slash{inset:-30%;background:var(--orange);clip-path:polygon(0 42%,100% 20%,100% 58%,0 80%);transform:translateX(-110%)}.story.termo .speed{left:50%;top:50%;color:var(--navy);font:900 120px Arial,sans-serif;white-space:nowrap;transform:translate(-50%,-50%) scale(.7);opacity:0}.story.termo.cover .slash{animation:speedSlash .56s var(--ease) both}.story.termo.cover .speed{animation:speedText .46s var(--ease) .15s both}.story.termo.reveal .slash{animation:speedExit .46s ease-in both}.story.termo.reveal .speed{animation:speedTextOut .3s ease both}@keyframes speedSlash{to{transform:translateX(0)}}@keyframes speedText{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes speedExit{to{transform:translateX(110%)}}@keyframes speedTextOut{to{opacity:0;letter-spacing:.2em}}
    .story.localize .world{left:13%;top:22%;width:320px;height:320px;border:3px solid var(--sky);border-radius:50%;background:repeating-linear-gradient(90deg,transparent 0 38px,#8ed8f822 39px 41px);transform:scale(.2);opacity:0}.story.localize .fold-arrow{left:50%;top:50%;width:250px;height:100px;background:var(--orange);clip-path:polygon(0 0,72% 0,100% 50%,72% 100%,0 100%,18% 50%);transform:translate(-50%,-50%) scaleX(0)}.story.localize .br{right:14%;top:28%;width:230px;height:230px;display:grid;place-items:center;border-radius:50%;background:var(--sky);color:var(--navy);font:900 82px Arial,sans-serif;transform:scale(0)}.story.localize.cover .world{animation:worldIn .45s var(--ease) both}.story.localize.cover .fold-arrow{animation:arrowIn .42s var(--ease) .2s both}.story.localize.cover .br{animation:pop .4s var(--ease) .45s both}.story.localize.reveal>*:not(.label){animation:localizeOut .4s ease-in both}@keyframes worldIn{to{opacity:1;transform:scale(1)}}@keyframes arrowIn{to{transform:translate(-50%,-50%) scaleX(1)}}@keyframes localizeOut{to{opacity:0;transform:translateY(-70px) scale(.82)}}
    .story.machine{background:var(--paper)}.story.machine .belt{left:5%;right:5%;top:46%;display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.story.machine .belt i{height:105px;background:var(--navy);transform:translateY(150px);opacity:0}.story.machine .belt i:nth-child(3){background:var(--orange)}.story.machine.cover .belt i{animation:machineUp .46s var(--ease) both;animation-delay:calc(var(--n)*70ms)}.story.machine.reveal .belt i{animation:machineRun .4s ease-in both;animation-delay:calc(var(--n)*35ms)}@keyframes machineUp{to{opacity:1;transform:none}}@keyframes machineRun{to{opacity:0;transform:translateX(200px) scaleX(.6)}}
    .story.deep{background:var(--sky)}.story.deep .rings{left:50%;top:0;width:1200px;height:1200px;border:12px solid var(--navy);border-radius:50%;box-shadow:0 0 0 80px #8ed8f8,0 0 0 94px #0b1736,0 0 0 180px #8ed8f8,0 0 0 194px #0b1736;transform:translate(-50%,-90%) scale(.15)}.story.deep .depth{left:50%;top:46%;color:var(--navy);font:900 105px Arial,sans-serif;transform:translate(-50%,-50%);opacity:0}.story.deep.cover .rings{animation:deepDive .62s var(--ease) both}.story.deep.cover .depth{animation:depthIn .4s var(--ease) .2s both}.story.deep.reveal .rings{animation:deepOut .5s ease-in both}.story.deep.reveal .depth{animation:depthOut .3s ease both}@keyframes deepDive{to{transform:translate(-50%,-38%) scale(1)}}@keyframes depthIn{to{opacity:1;transform:translate(-50%,-20%)}}@keyframes deepOut{to{transform:translate(-50%,20%) scale(1.35);opacity:0}}@keyframes depthOut{to{opacity:0;transform:translate(-50%,30%)}}
    .story.climb .mountain{left:15%;right:15%;bottom:-10%;height:90%;background:linear-gradient(110deg,#152757 0 48%,#20376e 48%);clip-path:polygon(50% 0,100% 100%,0 100%);transform:translateY(100%)}.story.climb .path{left:50%;bottom:10%;width:10px;height:70%;background:var(--orange);transform:translateX(-50%) scaleY(0);transform-origin:bottom}.story.climb .marker{left:50%;top:18%;width:46px;height:46px;border-radius:50%;background:var(--sky);transform:translate(-50%,500px) scale(0)}.story.climb.cover .mountain{animation:mountainUp .5s var(--ease) both}.story.climb.cover .path{animation:pathUp .48s var(--ease) .18s both}.story.climb.cover .marker{animation:markerUp .58s var(--ease) .22s both}.story.climb.reveal>*:not(.label){animation:climbOut .42s ease-in both}@keyframes mountainUp{to{transform:none}}@keyframes pathUp{to{transform:translateX(-50%) scaleY(1)}}@keyframes markerUp{to{transform:translate(-50%,0) scale(1)}}@keyframes climbOut{to{opacity:0;transform:translateY(-120px)}}
    .story.share .orbit{left:50%;top:50%;width:160px;height:160px;border:8px solid var(--orange);border-radius:50%;transform:translate(-50%,-50%) scale(.1);opacity:0}.story.share .node{width:54px;height:54px;border-radius:50%;background:var(--sky);left:calc(50% - 27px);top:calc(50% - 27px)}.story.share.cover .orbit{animation:orbitGrow .55s var(--ease) both}.story.share.cover .node{animation:nodeShare .62s var(--ease) both;animation-delay:calc(var(--n)*45ms)}.story.share.reveal .orbit,.story.share.reveal .node{animation:shareOut .38s ease-in both}@keyframes orbitGrow{to{opacity:1;transform:translate(-50%,-50%) scale(3.7)}}@keyframes nodeShare{to{transform:rotate(calc(var(--n)*90deg)) translateX(300px)}}@keyframes shareOut{to{opacity:0;transform:scale(1.5)}}
    .story.split{background:linear-gradient(90deg,var(--paper) 0 50%,var(--sky) 50%)}.story.split .divider{left:50%;top:0;bottom:0;width:8px;background:var(--orange);transform:scaleY(0)}.story.split .fact,.story.split .hyp{top:42%;font:900 74px Arial,sans-serif;color:var(--navy);opacity:0}.story.split .fact{right:55%}.story.split .hyp{left:55%}.story.split.cover .divider{animation:dividerIn .45s var(--ease) both}.story.split.cover .fact{animation:factIn .45s var(--ease) .12s both}.story.split.cover .hyp{animation:hypIn .45s var(--ease) .18s both}.story.split.reveal>*{animation:splitOut .35s ease-in both}@keyframes dividerIn{to{transform:scaleY(1)}}@keyframes factIn{to{opacity:1;transform:translateX(30px)}}@keyframes hypIn{to{opacity:1;transform:translateX(-30px)}}@keyframes splitOut{to{opacity:0;transform:scaleX(.5)}}
    .story.final .mark{left:50%;top:50%;width:420px;height:340px;transform:translate(-50%,-50%) rotate(-12deg) scale(0)}.story.final .mark:before,.story.final .mark:after{content:"";position:absolute;width:250px;height:250px}.story.final .mark:before{left:0;top:0;background:var(--sky);clip-path:polygon(0 0,100% 0,56% 100%,0 100%)}.story.final .mark:after{right:0;bottom:0;background:var(--orange);clip-path:polygon(44% 0,100% 0,100% 100%,0 100%)}.story.final.cover .mark{animation:finalMark .62s var(--ease) both}.story.final.reveal .mark{animation:finalOpen .55s var(--ease) both}@keyframes finalMark{to{transform:translate(-50%,-50%) rotate(0) scale(1)}}@keyframes finalOpen{to{transform:translate(-50%,-50%) rotate(0) scale(5);opacity:0}}
    /* Calibração V3: uma única gramática de movimento, sem varreduras laterais */
    .story.cover{animation-duration:.5s}.story.reveal{animation-duration:.62s}
    .story.cover .piece,.story.cover .letters i,.story.cover .belt i{animation-duration:.64s!important;animation-timing-function:var(--ease)!important}
    .story.reveal .piece,.story.reveal .letters i,.story.reveal .belt i{animation-duration:.48s!important;animation-timing-function:var(--ease)!important;animation-delay:0ms!important}
    @keyframes letterScatter{to{opacity:0;transform:scale(.88)}}
    @keyframes timelineOut{to{opacity:0;transform:scale(.92)}}
    @keyframes speedSlash{from{transform:scaleX(0);opacity:0}to{transform:scaleX(1);opacity:1}}
    @keyframes speedExit{to{opacity:0;transform:scaleX(.94)}}
    @keyframes speedTextOut{to{opacity:0;transform:translate(-50%,-50%) scale(.94)}}
    @keyframes localizeOut{to{opacity:0;transform:scale(.92)}}
    @keyframes machineRun{to{opacity:0;transform:scale(.92)}}
    @keyframes climbOut{to{opacity:0;transform:scale(.94)}}
    @keyframes splitOut{to{opacity:0;transform:scale(.96)}}
    @keyframes finalMark{to{transform:translate(-50%,-50%) scale(1)}}
    @keyframes finalOpen{to{transform:translate(-50%,-50%) scale(1.08);opacity:0}}
    .chrome{position:fixed;z-index:40;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid #ffffff20;border-radius:999px;background:#071029d9;box-shadow:0 12px 36px #0007;backdrop-filter:blur(16px);opacity:.28;transition:.25s}.chrome:hover,.chrome:focus-within{opacity:1}.chrome button{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:var(--paper);cursor:pointer}.chrome button:hover{background:var(--orange);color:var(--navy)}.count{min-width:82px;color:var(--paper);font:700 11px monospace;letter-spacing:.12em;text-align:center}.track{width:min(32vw,420px);height:3px;background:#ffffff25;overflow:hidden}.track i{display:block;width:100%;height:100%;background:var(--sky);transform:scaleX(0);transform-origin:left;transition:transform .55s var(--ease)}
    .hint{position:fixed;z-index:39;right:18px;top:18px;padding:8px 11px;border:1px solid #ffffff18;color:#f5f0e688;background:#071029aa;font:700 9px monospace;letter-spacing:.08em;text-transform:uppercase;transition:.3s}.hint.hide{opacity:0}.overview{position:fixed;z-index:50;inset:0;padding:7vh 5vw;background:#071029f5;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;overflow:auto}.overview[hidden]{display:none}.overview button{min-height:120px;padding:18px;border:1px solid #ffffff1d;background:#0b1736;color:var(--paper);text-align:left;cursor:pointer;transition:.25s}.overview button:hover{border-color:var(--sky);transform:translateY(-4px)}.overview small{display:block;color:var(--orange);font:700 10px monospace}.overview b{display:block;margin-top:28px;font-size:18px}.overview .close{position:fixed;right:24px;top:20px;width:42px;min-height:42px;padding:0;border-radius:50%;text-align:center;font-size:22px}
    @media(max-width:800px){.track{width:26vw}.overview{grid-template-columns:1fr 1fr}.hint{display:none}}
    @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="stage" id="stage"><iframe id="frame" title="Slide atual" src="dobra-pdf.html?slide=1"></iframe><div class="fold" id="fold"><i></i><i></i></div><div class="tiles" id="tiles"></div><div class="iris" id="iris"></div><div class="dive" id="dive"></div><div class="story" id="story"></div></main>
  <div class="hint" id="hint">clique, espaço ou → para avançar</div>
  <nav class="chrome" aria-label="Controles"><button id="prev" aria-label="Anterior">←</button><span class="count"><b id="current">01</b> / 13</span><div class="track"><i id="progress"></i></div><button id="overviewButton" aria-label="Visão geral">⌘</button><button id="fullscreen" aria-label="Tela cheia">⛶</button><button id="next" aria-label="Próximo">→</button></nav>
  <div class="overview" id="overview" hidden></div>
  <script>
    const titles=['DOBRA','O que é Wordle?','A tração do Wordle','Termo: mais rápido e com menos risco','A oportunidade','A solução DOBRA','A máquina em cinco etapas','O que é Krillion?','Krillion: usuários e receita','O primeiro protótipo','Aquisição e receita','Fatos e hipóteses','A tese'];
    const storyTypes=['final','wordle','timeline','termo','localize','final','machine','deep','deep','climb','share','split','final'];
    const storyLabels=['DOBRA','seis tentativas','90 → 300 mil','mais rápido','global → local','a solução','cinco etapas','mais rara, mais fundo','97 dias','raridade → altitude','jogar → compartilhar','fatos × hipóteses','formatos globais · jogos locais'];
    const stage=document.querySelector('#stage'),frame=document.querySelector('#frame'),progress=document.querySelector('#progress'),current=document.querySelector('#current'),overview=document.querySelector('#overview'),hint=document.querySelector('#hint');
    let index=Math.max(0,Math.min(12,(+location.hash.slice(1)||1)-1)),busy=false;
    const tiles=document.querySelector('#tiles');tiles.innerHTML=Array.from({length:40},(_,i)=>`<b style="--i:${Math.abs((i%8)-3.5)+Math.floor(i/8)}"></b>`).join('');
    function scale(){document.documentElement.style.setProperty('--scale',Math.min(innerWidth/1600,innerHeight/900))}addEventListener('resize',scale);scale();
    function update(){current.textContent=String(index+1).padStart(2,'0');progress.style.transform=`scaleX(${(index+1)/13})`;history.replaceState(null,'',`#${index+1}`)}
    function animateInside(){try{const d=frame.contentDocument,s=d.querySelectorAll('.slide')[index];if(!s)return;d.body.style.overflow='hidden';const selectors=['.kicker','h1','h2','.wordle-intro-copy>p','.wordle-rules>*','.wordle-shot','.traction','.elapsed','.wordle-note','.case-note','.termo-stat','.risk-strip','.opportunity-note','.market-side','.fold-bridge','.fold-mark','.brand-word','.brand-tag','.brand-copy>p','.step','.process-note','.krillion-intro-copy>p','.krillion-rules>*','.krillion-shot','.krillion-copy>p','.krillion-word','.krillion-business-card','.krillion-caveat','.screen','.demo-copy .formula>*','.loop>*','.money','.known li','.unknown li','.honest','.closing-line'];let nodes=[...s.querySelectorAll(selectors.join(','))];nodes.forEach((el,i)=>{el.style.opacity='0';el.style.transform=index===7||index===8?`translateY(${Math.min(80,24+i*3)}px)`:`translateY(30px)`;el.style.transition=`opacity .7s ${100+i*55}ms cubic-bezier(.16,1,.3,1), transform .85s ${100+i*55}ms cubic-bezier(.16,1,.3,1)`});requestAnimationFrame(()=>requestAnimationFrame(()=>nodes.forEach(el=>{el.style.opacity='1';el.style.transform='none'})));if(index===6)s.querySelectorAll('.step').forEach((el,i)=>el.style.transitionDelay=`${170+i*120}ms`);if(index===10)s.querySelectorAll('.loop>div').forEach((el,i)=>el.style.transitionDelay=`${180+i*130}ms`)}catch(e){}}
    frame.addEventListener('load',()=>{frame.classList.add('ready');stage.classList.remove('exit');stage.classList.add('enter');animateInside();setTimeout(()=>stage.classList.remove('enter'),950)});
    function storyMarkup(type,label){const l=`<span class="piece label">${label}</span>`;if(type==='wordle')return `<div class="letters">${[...'TERMO'].map((x,i)=>`<i style="--n:${i}">${x}</i>`).join('')}</div>${l}`;if(type==='timeline')return `<i class="piece rail"></i><i class="piece dot a"></i><i class="piece dot b"></i><b class="piece number a">90</b><b class="piece number b">300 MIL</b>${l}`;if(type==='termo')return `<i class="piece slash"></i><b class="piece speed">3 DIAS → 1 SEMANA</b>${l}`;if(type==='localize')return `<i class="piece world"></i><i class="piece fold-arrow"></i><b class="piece br">BR</b>${l}`;if(type==='machine')return `<div class="piece belt">${[0,1,2,3,4].map(i=>`<i style="--n:${i}"></i>`).join('')}</div>${l}`;if(type==='deep')return `<i class="piece rings"></i><b class="piece depth">MERGULHAR</b>${l}`;if(type==='climb')return `<i class="piece mountain"></i><i class="piece path"></i><i class="piece marker"></i>${l}`;if(type==='share')return `<i class="piece orbit"></i>${[0,1,2,3].map(i=>`<i class="piece node" style="--n:${i}"></i>`).join('')}${l}`;if(type==='split')return `<i class="piece divider"></i><b class="piece fact">FATOS</b><b class="piece hyp">HIPÓTESES</b>${l}`;return `<i class="piece mark"></i>${l}`}
    async function show(next){if(busy)return;next=(next+13)%13;if(next===index)return;busy=true;hint.classList.add('hide');const fx=document.querySelector('#story'),type=storyTypes[next];fx.innerHTML=storyMarkup(type,storyLabels[next]);fx.className=`story ${type} run cover`;stage.classList.add('exit');await new Promise(r=>setTimeout(r,880));index=next;update();frame.classList.remove('ready');frame.src=`dobra-pdf.html?slide=${index+1}&present=1`;fx.className=`story ${type} run reveal`;await new Promise(r=>setTimeout(r,660));fx.className='story';fx.innerHTML='';busy=false}
    document.querySelector('#prev').onclick=e=>{e.stopPropagation();show(index-1)};document.querySelector('#next').onclick=e=>{e.stopPropagation();show(index+1)};
    document.querySelector('#fullscreen').onclick=e=>{e.stopPropagation();document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()};
    function toggleOverview(){if(!overview.hidden){overview.hidden=true;return}overview.innerHTML='<button class="close" aria-label="Fechar">×</button>'+titles.map((t,i)=>`<button data-i="${i}"><small>${String(i+1).padStart(2,'0')}</small><b>${t}</b></button>`).join('');overview.hidden=false}
    document.querySelector('#overviewButton').onclick=e=>{e.stopPropagation();toggleOverview()};overview.onclick=e=>{e.stopPropagation();const b=e.target.closest('button');if(!b)return;if(b.classList.contains('close'))toggleOverview();else{overview.hidden=true;show(+b.dataset.i)}};
    addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' ','Enter'].includes(e.key)){e.preventDefault();show(index+1)}if(['ArrowLeft','PageUp','Backspace'].includes(e.key)){e.preventDefault();show(index-1)}if(e.key==='Home')show(0);if(e.key==='End')show(12);if(e.key.toLowerCase()==='o')toggleOverview();if(e.key.toLowerCase()==='f')document.querySelector('#fullscreen').click();if(e.key==='Escape')overview.hidden=true});
    stage.addEventListener('click',()=>show(index+1));let startX=null;addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{if(startX===null)return;const dx=e.changedTouches[0].clientX-startX;if(Math.abs(dx)>60)show(index+(dx<0?1:-1));startX=null},{passive:true});
    index=0;update();frame.src='dobra-pdf.html?slide=1&present=1';setTimeout(()=>hint.classList.add('hide'),5000);
  </script>
</body>
</html>
